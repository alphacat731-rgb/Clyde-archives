<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Discover - Clyde Vault</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #313338;
      color: #f2f3f5;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #2b2d31;
    }

    ::-webkit-scrollbar-thumb {
      background: #1a1b1e;
      border-radius: 4px;
    }

    .discover-hero {
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255, 255, 255, 0.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(255, 255, 255, 0.10),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #5865f2 0%,
          #4752c4 52%,
          #2b2d31 100%
        );
    }

    .search-input {
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.22);
    }

    .art-card {
      animation: cardIn 0.22s ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .image-wrap {
      position: relative;
      height: 210px;
      background: #1e1f22;
      overflow: hidden;
    }

    .image-wrap img.art-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .art-card:hover .image-wrap img.art-image {
      transform: scale(1.035);
    }

    .image-loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #1e1f22;
      z-index: 1;
    }

    .image-loader.hidden {
      display: none;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #4e5058;
      border-top-color: #5865f2;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .broken-image {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      padding: 20px;
      color: #949ba4;
      background: #1e1f22;
      z-index: 2;
    }

    .broken-image.show {
      display: grid;
    }

    .lightbox {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: min(1200px, 94vw);
      max-height: 88vh;
      object-fit: contain;
    }

    .search-status {
      min-height: 20px;
    }

    .empty-state {
      min-height: 250px;
    }

    .source-badge {
      backdrop-filter: blur(8px);
    }
  </style>
</head>

<body class="h-screen overflow-hidden flex select-none">

  <!-- =========================================================
       SERVER RAIL
       ========================================================= -->

  <aside

  <!-- =========================================================

      <button

        <button

            class="w-4 h-4"

        </button>

  </aside>


  <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->

  <main
    class="flex-1 flex flex-col
           bg-[#313338]
           h-full overflow-y-auto
           relative"
  >

    <!-- HERO -->

    <div
      class="discover-hero relative
             p-10 md:p-12
             flex flex-col
             items-center justify-center
             text-center"
    >

      <h1
        class="text-3xl font-extrabold

      >
        Find your favorite Clyde art on Discord
      </h1>


      <p
        class="text-sm text-[#dbdee1]
               max-w-xl mb-6"
      >
        Search real image sources for Clyde,
        furry Discord mascot art, fan art,
        memes, logos, and more.
      </p>


      <!-- SEARCH -->

      <form
        id="search-form"
        class="relative w-full max-w-2xl"
      >

        <input
          type="search"
          id="search-input"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search images..."
          aria-label="Search images"
          class="search-input
                 w-full h-12
                 pl-12 pr-24
                 rounded-xl
                 bg-[#1e1f22]
                 text-white text-sm
                 placeholder-[#949ba4]
                 focus:outline-none
                 focus:ring-2
                 focus:ring-[#5865f2]"
        >


        <i
          data-lucide="search"
          class="w-5 h-5
                 text-[#949ba4]
                 absolute left-4 top-3.5
                 pointer-events-none"
        ></i>


        <button
          id="search-button"
          type="submit"
          class="absolute right-1.5 top-1.5
                 h-9 px-4
                 rounded-lg
                 bg-[#5865f2]
                 hover:bg-[#4752c4]
                 text-white text-xs
                 font-bold
                 transition-colors"
        >
          Search
        </button>

      </form>


      <div
        id="search-status"
        class="search-status
               mt-3
               text-xs
               text-[#dbdee1]"
        aria-live="polite"
      ></div>

    </div>


    <!-- RESULTS -->

    <div
      class="p-6 md:p-8
             max-w-7xl
             mx-auto
             w-full"
    >

      <div
        class="flex items-center
               justify-between
               gap-4 mb-4"
      >

        <h2
          class="text-lg
                 font-bold
                 text-white"
          id="section-title"
        >
          Featured Artworks
        </h2>


        <button
          id="clear-search"
          type="button"
          class="hidden
                 text-xs
                 font-semibold
                 text-[#b5bac1]
                 hover:text-white
                 transition-colors"
        >
          Clear search
        </button>

      </div>


      <div
        id="art-grid"
        class="grid
               grid-cols-1
               sm:grid-cols-2
               lg:grid-cols-3
               xl:grid-cols-4
               gap-4
               pb-12"
      ></div>

    </div>

  </main>


  <!-- =========================================================
       LIGHTBOX
       ========================================================= -->

  <div
    id="lightbox"
    class="lightbox
           fixed inset-0
           bg-black/90
           z-50
           flex items-center
           justify-center
           p-4"
    role="dialog"
    aria-modal="true"
    aria-label="Image preview"
  >

    <button
      id="lightbox-close"
      type="button"
      aria-label="Close image"
      class="absolute
             top-5 right-5
             w-10 h-10
             rounded-full
             bg-white/10
             hover:bg-white/20
             flex items-center
             justify-center
             text-white"
    >
      <i
        data-lucide="x"
        class="w-6 h-6"
      ></i>
    </button>


    <div
      class="max-w-full
             max-h-full
             flex flex-col
             items-center
             gap-3"
    >

      <img
        id="lightbox-img"
        class="rounded-lg shadow-2xl"
        alt=""
      >

      <div
        id="lightbox-caption"
        class="text-xs
               text-[#dbdee1]
               text-center
               max-w-2xl"
      ></div>

    </div>

  </div>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>

    /*

      }

    ];


    /*
     * ==========================================================

     * ==========================================================
     */

    const state = {

      category: "all",

      query: "",

      page: 1,

      loading: false,

      searchController: null,

      lastResults: []

    };


    /*
     * ==========================================================
     * HELPER
     * ==========================================================
     */

    const $ = (id) => document.getElementById(id);


    function escapeHtml(value = "") {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }


    function setStatus(message = "") {

      $("search-status").textContent = message;

    }


    function setLoading(loading) {

      state.loading = loading;

      $("search-button").disabled = loading;

      $("search-button").textContent =
        loading
          ? "Searching..."
          : "Search";

    }


    /*
     * ==========================================================
     * IMAGE CARD
     * ==========================================================
     */

    function createCard(item, index) {

      const card = document.createElement("article");

      card.className =
        "art-card " +
        "bg-[#2b2d31] " +
        "rounded-xl " +
        "overflow-hidden " +
        "border border-[#1f2023] " +
        "hover:border-[#4e5058] " +
        "hover:shadow-2xl " +
        "transition-all " +
        "hover:-translate-y-1 " +
        "cursor-pointer " +
        "flex flex-col";


      card.style.animationDelay =
        `${Math.min(index * 25, 300)}ms`;


      const safeTitle =
        escapeHtml(item.title || "Untitled image");

      const safeArtist =
        escapeHtml(item.artist || "Unknown");

      const safeDate =
        escapeHtml(item.date || "");

      const safeLikes =
        escapeHtml(item.likes || "");

      const safeAvatar =
        escapeHtml(item.avatar || "");

      const safeUrl =
        escapeHtml(item.imageUrl || "");

      const safePage =
        escapeHtml(item.pageUrl || "");

      const source =
        escapeHtml(item.source || "Vault");


      card.innerHTML = `

        <div class="image-wrap">

          <div class="image-loader">

            <div class="spinner"></div>

          </div>


          <img
            class="art-image"
            src="${safeUrl}"
            alt="${safeTitle}"
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          >


          <div class="broken-image">

            <div>

              <i
                data-lucide="image-off"
                class="w-8 h-8
                       mx-auto mb-2"
              ></i>

              <div class="text-xs">
                Image couldn't be loaded
              </div>

            </div>

          </div>


          <div
            class="source-badge
                   absolute
                   top-2 left-2
                   px-2 py-1
                   rounded-md
                   bg-black/65
                   text-[10px]
                   font-bold
                   text-white"
          >
            ${source}
          </div>

        </div>


        <div
          class="p-4
                 flex-1
                 flex flex-col
                 justify-between"
        >

          <div>

            <div
              class="flex
                     items-center
                     gap-2 mb-2"
            >

              <img
                src="${safeAvatar}"
                class="w-6 h-6
                       rounded-full
                       bg-[#1e1f22]"
                alt=""
                loading="lazy"
                referrerpolicy="no-
