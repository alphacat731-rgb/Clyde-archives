<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Discover - Clyde Vault</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #313338;
      color: #f2f3f5;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #2b2d31;
    }

    ::-webkit-scrollbar-thumb {
      background: #1a1b1e;
      border-radius: 4px;
    }

    .discover-hero {
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.15), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,.10), transparent 30%),
        linear-gradient(135deg, #5865f2 0%, #4752c4 50%, #2b2d31 100%);
    }

    .art-card {
      background: #2b2d31;
      border: 1px solid #1f2023;
      border-radius: 10px;
      overflow: hidden;
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
    }

    .art-card:hover {
      transform: translateY(-4px);
      border-color: #4e5058;
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
    }

    .art-image-container {
      height: 192px;
      background: #1e1f22;
      position: relative;
      overflow: hidden;
    }

    .art-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .2s ease;
    }

    .art-card:hover .art-image {
      transform: scale(1.035);
    }

    .image-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1f22;
      z-index: 2;
    }

    .image-loading.hidden {
      display: none;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #4e5058;
      border-top-color: #5865f2;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .image-error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #949ba4;
      background: #1e1f22;
      padding: 20px;
      z-index: 3;
    }

    .image-error.show {
      display: flex;
    }

    .source-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      padding: 4px 7px;
      border-radius: 5px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      z-index: 4;
    }

    .search-spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    .result-count {
      color: #949ba4;
      font-size: 11px;
    }

    .empty-state {
      min-height: 260px;
      border: 1px solid #3b3d44;
      background: #2b2d31;
      border-radius: 10px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 80px rgba(0,0,0,.5);
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 28px;
      cursor: pointer;
      z-index: 101;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,.22);
    }

    .icon {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 700px) {
      .server-rail {
        width: 54px !important;
      }

      .discover-sidebar {
        width: 190px !important;
      }

      .hero-content {
        padding: 32px 18px !important;
      }

      .hero-content h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

  <!-- MAIN -->

    <!-- HERO -->

        Find your favorite Clyde art on Discord

      <p class="text-sm text-[#dbdee1] max-w-md mb-6">
        From original 2021 rebrand memes to community fan art, explore the complete vault.
      </p>

      <form id="search-form" class="relative w-full max-w-lg">

          placeholder="Explore Clyde artworks..."

        >

        <button

          class="absolute right-1 top-1 h-9 px-3 rounded-md bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold transition-colors"
        >
          Search
        </button>

      </form>

      <div id="search-status" class="mt-3 min-h-[16px] text-xs text-[#dbdee1]"></div>

    </div>


    <!-- ARTWORKS -->
    <div class="p-8 max-w-7xl mx-auto w-full">

      <div class="flex items-center justify-between mb-4">

        <h2 class="text-lg font-bold text-white" id="section-title">

        <button

    </div>

  </main>

    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHTML(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================================================
       CARD
       ========================================================= */

      const card = document.createElement("div");

      card.className =

        escapeHTML(item.title || "Untitled");

      const safeArtist =
        escapeHTML(item.artist || "Unknown");

        escapeHTML(item.likes || "");

      const safeDate =
        escapeHTML(item.date || "");

      const safeAvatar =
        escapeHTML(item.avatar || "");

      const safeImage =
        escapeHTML(item.imageUrl || "");

      const safeSource =
        escapeHTML(item.source || "Vault");

        <div class="art-image-container">

          <div class="image-loading">
            <div class="spinner"></div>
          </div>

          </div>

            class="art-i
