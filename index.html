<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Discover - Clyde Vault</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #313338;
      color: #f2f3f5;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #2b2d31;
    }

    ::-webkit-scrollbar-thumb {
      background: #1a1b1e;
      border-radius: 4px;
    }

    .discover-hero {
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.15), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,.10), transparent 30%),
        linear-gradient(135deg, #5865f2 0%, #4752c4 50%, #2b2d31 100%);
    }

    .art-card {
      background: #2b2d31;
      border: 1px solid #1f2023;
      border-radius: 10px;
      overflow: hidden;
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
    }

    .art-card:hover {
      transform: translateY(-4px);
      border-color: #4e5058;
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
    }

    .art-image-container {
      height: 192px;
      background: #1e1f22;
      position: relative;
      overflow: hidden;
    }

    .art-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .2s ease;
    }

    .art-card:hover .art-image {
      transform: scale(1.035);
    }

    .image-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1f22;
      z-index: 2;
    }

    .image-loading.hidden {
      display: none;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #4e5058;
      border-top-color: #5865f2;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .image-error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #949ba4;
      background: #1e1f22;
      padding: 20px;
      z-index: 3;
    }

    .image-error.show {
      display: flex;
    }

    .source-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      padding: 4px 7px;
      border-radius: 5px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      z-index: 4;
    }

    .search-spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    .result-count {
      color: #949ba4;
      font-size: 11px;
    }

    .empty-state {
      min-height: 260px;
      border: 1px solid #3b3d44;
      background: #2b2d31;
      border-radius: 10px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 80px rgba(0,0,0,.5);
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 28px;
      cursor: pointer;
      z-index: 101;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,.22);
    }

    .icon {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 700px) {
      .server-rail {
        width: 54px !important;
      }

      .discover-sidebar {
        width: 190px !important;
      }

      .hero-content {
        padding: 32px 18px !important;
      }

      .hero-content h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

    <div class="h-14 bg-[#232428] px-3 flex items-center justify-between flex-shrink-0">

      <div class="flex items-center gap-2">

        </div>

        <div class="flex flex-col">

      <div class="flex items-center text-[#b5bac1]">

        <button class="p-1 hover:text-white">

        </button>

        <button class="p-1 hover:text-white">
          <span class="icon w-4 h-4" data-icon="settings"></span>
        </button>

      </div>

    </div>

  </aside>


  <!-- MAIN -->
  <main class="flex-1 flex flex-col bg-[#313338] h-full overflow-y-auto relative">

    <!-- HERO -->
    <div class="discover-hero hero-content relative p-12 flex flex-col items-center justify-center text-center">

      <h1 class="text-3xl font-extrabold text-white mb-2">
        Find your favorite Clyde art on Discord
      </h1>

      <p class="text-sm text-[#dbdee1] max-w-md mb-6">
        From original 2021 rebrand memes to community fan art, explore the complete vault.
      </p>

      <form id="search-form" class="relative w-full max-w-lg">

        <input
          type="text"
          id="search-input"
          autocomplete="off"
          placeholder="Explore Clyde artworks..."
          class="w-full h-11 pl-4 pr-24 rounded-md bg-[#1e1f22] text-white text-sm placeholder-[#949ba4] focus:outline-none focus:ring-2 focus:ring-[#5865f2]"
        >

        <button
          type="submit"
          id="search-button"
          class="absolute right-1 top-1 h-9 px-3 rounded-md bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold transition-colors"
        >
          Search
        </button>

      </form>

      <div id="search-status" class="mt-3 min-h-[16px] text-xs text-[#dbdee1]"></div>

    </div>


    <!-- ARTWORKS -->
    <div class="p-8 max-w-7xl mx-auto w-full">

      <div class="flex items-center justify-between mb-4">

        <h2 class="text-lg font-bold text-white" id="section-title">
          Featured Artworks
        </h2>

        <button
          id="clear-search"
          onclick="clearSearch()"
          class="hidden text-xs text-[#949ba4] hover:text-white"
        >
          Clear search
        </button>

      </div>

      <div

        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-12"
      ></div>

    </div>

  </main>


  <!-- LIGHTBOX -->
  <div
    id="lightbox"
    class="lightbox"
    onclick="closeLightbox(event)"
  >

    <button
      class="lightbox-close"
      onclick="event.stopPropagation(); closeLightbox()"
      aria-label="Close"

      ×
    </button>

    <img
      id="lightbox-img"

      root.querySelectorAll("[data-icon]").forEach(el => {

    let currentFilter = "all";

    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHTML(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================================================
       CARD
       ========================================================= */

    function createCard(item) {

      const card = document.createElement("div");

      card.className =
        "art-card flex flex-col cursor-pointer";


      const safeTitle =
        escapeHTML(item.title || "Untitled");

      const safeArtist =
        escapeHTML(item.artist || "Unknown");

      const safeLikes =
        escapeHTML(item.likes || "");

      const safeDate =
        escapeHTML(item.date || "");

      const safeAvatar =
        escapeHTML(item.avatar || "");

      const safeImage =
        escapeHTML(item.imageUrl || "");

      const safeSource =
        escapeHTML(item.source || "Vault");


      card.innerHTML = `

        <div class="art-image-container">

          <div class="image-loading">
            <div class="spinner"></div>
          </div>

          <div class="source-badge">
            ${safeSource}
          </div>

          <img
            class="art-image"
            src="${safeImage}"
            alt="${safeTitle}"
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          >

          <div class="image-error">

            <span class="icon w-8 h-8 mb-2 text-[#949ba4]"
                  data-icon="imageOff"></span>

            <span class="text-xs">
              Image could not be loaded
            </span>

          </div>

        </div>


        <div class="p-4 flex-1 flex flex-col justify-between">

          <div>

            <div class="flex items-center gap-2 mb-2">

              <img
                src="${safeAvatar}"
                class="w-5 h-5 rounded-full bg-[#1e1f22]"
                alt=""
                loading="lazy"
              >

              <span class="text-xs font-bold text-white truncate">
                ${safeArtist}
              </span>

            </div>

            <h3 class="font-bold text-white text-sm leading-snug">
              ${safeTitle}
            </h3>

          </div>


          <div
            class="mt-4 pt-3 border-t border-[#35373c]
                   flex items-center justify-between
                   text-[11px] text-[#949ba4]"
          >

            <span>${safeLikes}</span>
            <span>${safeDate}</span>

          </div>

        </div>

      `;


      const image =
        card.querySelector(".art-image");

      const loading =
        card.querySelector(".image-loading");

      const error =
        card.querySelector(".image-error");


      image.addEventListener("load", () => {

        loading.classList.add("hidden");

      });


      image.addEventListener("error", () => {

        loading.classList.add("hidden");

        error.classList.add("show");

      });


      card.addEventListener("click", event => {

        if (event.target.closest("a")) {
          return;
        }

        openLightbox(
          item.fullImageUrl || item.imageUrl
        );

      });


      renderIcons(card);

      return card;

    }


    /* =========================================================
       RENDER GRID
       ========================================================= */

    function renderGrid(items) {

      const grid =
        document.getElementById("art-grid");


      grid.innerHTML = "";


      if (!items.length) {

        grid.innerHTML = `

          <div class="empty-state col-span-full flex flex-col items-center justify-center text-center p-8">

            <span
              class="icon w-10 h-10 mb-3 text-[#949ba4]"
              data-icon="searchX"
            ></span>

            <h3 class="font-bold text-white mb-1">
              No images found
            </h3>

            <p class="text-sm text-[#949ba4]">
              Try searching for Clyde, Discord, furry Clyde, or another term.
            </p>

          </div>

        `;

        renderIcons(grid);

        return;

      }


      const fragment =
        document.createDocumentFragment();


      items.forEach(item => {

        fragment.appendChild(
          createCard(item)
        );

      });


      grid.appendChild(fragment);

    }


    /* =========================================================
       CATEGORY FILTER
       ========================================================= */

    function filterCategory(cat) {

      currentFilter = cat;


      document
        .querySelectorAll(".nav-btn")
        .forEach(btn => {

          btn.classList.remove(
            "bg-[#35373c]",
            "text-white"
          );

          btn.classList.add(
            "text-[#949ba4]"
          );

        });


      const activeBtn =
        document.getElementById(
          `nav-${cat}`
        );


      if (activeBtn) {

        activeBtn.classList.add(
          "bg-[#35373c]",
          "text-white"
        );

        activeBtn.classList.remove(
          "text-[#949ba4]"
        );

      }


      const names = {

        all: "Featured Artworks",

        originals: "2021 Rebrand Vault",

        fanart: "Fan Art & Drawings",

        memes: "Memes & Edits"

      };


      document.getElementById(
        "section-title"
      ).textContent =
        names[cat] || "Featured Artworks";


      const results =
        cat === "all"
          ? vaultData
          : vaultData.filter(
              item => item.category === cat
            );


      document.getElementById(
        "search-status"
      ).textContent = "";


      document.getElementById(
        "clear-search"
      ).classList.add("hidden");


      document.getElementById(
        "search-input"
      ).value = "";


      renderGrid(results);

    }


    /* =========================================================
       QUERY EXPANSION
       ========================================================= */

    function buildQueries(query) {

      const q =
        query
          .trim()
          .replace(/\s+/g, " ");


      const lower =
        q.toLowerCase();


      const queries =
        new Set();


      queries.add(q);


      const hasClyde =
        lower.includes("clyde");


      const hasDiscord =
        lower.includes("discord");


      const hasFurry =
        lower.includes("furry") ||
        lower.includes("anthro") ||
        lower.includes("anthropomorphic");


      const hasFanart =
        lower.includes("fanart") ||
        lower.includes("fan art");


      const hasMascot =
        lower.includes("mascot");


      /*
       * These are deliberately Clyde-heavy.
       *
       * If someone searches:
       *
       * furry
       *
       * we DON'T want random furry art.
       *
       * We want:
       *
       * furry Clyde
       * Discord furry mascot
       * Clyde anthro
       */

      if (!hasClyde) {

        queries.add(
          `${q} Clyde`
        );

      }


      if (hasFurry) {

        queries.add(
          "Clyde Discord furry"
        );

        queries.add(
          "Clyde furry mascot"
        );

        queries.add(
          "Discord Clyde anthro"
        );

        queries.add(
          "Discord mascot furry"
        );

        queries.add(
          "Clyde anthropomorphic Discord"
        );

      }


      if (hasFanart) {

        queries.add(
          "Clyde Discord fan art"
        );

        queries.add(
          "Clyde Discord fanart"
        );

      }


      if (hasMascot) {

        queries.add(
          "Clyde Discord mascot"
        );

        queries.add(
          "Discord mascot Clyde"
        );

      }


      if (hasDiscord && !hasClyde) {

        queries.add(
          "Clyde Discord"
        );

        queries.add(
          "Discord Clyde artwork"
        );

      }


      return [...queries];

    }


    /* =========================================================
       RELEVANCE SCORING
       ========================================================= */

    function scoreResult(title, description, query) {

      const text =
        `${title} ${description}`.toLowerCase();

      const q =
        query.toLowerCase();


      let score = 0;


      if (text.includes("clyde"))
        score += 100;


      if (text.includes("discord"))
        score += 70;


      if (text.includes("mascot"))
        score += 35;


      if (
        text.includes("furry") ||
        text.includes("anthro") ||
        text.includes("anthropomorphic")
      ) {

        score += 35;

      }


      if (
        text.includes("fan art") ||
        text.includes("fanart")
      ) {

        score += 20;

      }


      const words =
        q
          .split(/\s+/)
          .filter(word => word.length >= 3);


      for (const word of words) {

        if (text.includes(word))
          score += 12;

      }


      if (
        title
          .toLowerCase()
          .includes(q)
      ) {

        score += 50;

      }


      return score;

    }


    /* =========================================================
       WIKIMEDIA SEARCH
       ========================================================= */

    async function searchWikimedia(query) {

      const queries =
        buildQueries(query);


      const requests =
        queries.map(async searchTerm => {

          const params =
            new URLSearchParams({

              action: "query",

              generator: "search",

              gsrsearch: searchTerm,

              gsrnamespace: "6",

              gsrlimit: "25",

              prop: "imageinfo|categories",

              iiprop: "url|size|mime|extmetadata",

              iiurlwidth: "900",

              format: "json",

              formatversion: "2",

              origin: "*"

            });


          const response =
            await fetch(
              `https://commons.wikimedia.org/w/api.php?${params}`,
              {
                method: "GET",
                cache: "no-store",
                signal: searchController
                  ? searchController.signal
                  : undefined
              }
            );


          if (!response.ok) {

            throw new Error(
              `Wikimedia HTTP ${response.status}`
            );

          }


          return response.json();

        });


      const responses =
        await Promise.all(requests);


      const results =
        new Map();


      for (const data of responses) {

        const pages =
          data?.query?.pages || [];


        for (const page of pages) {

          const info =
            page.imageinfo?.[0];


          if (!info)
            continue;


          const imageUrl =
            info.thumburl ||
            info.url;


          if (!imageUrl)
            continue;


          /*
           * Don't accept obvious non-image files.
           */

          if (
            info.mime &&
            !info.mime.startsWith("image/")
          ) {

            continue;

          }


          const title =
            String(
              page.title || "Untitled"
            )
              .replace(/^File:/i, "");


          const metadata =
            info.extmetadata || {};


          const description =
            [
              metadata.ImageDescription?.value || "",
              metadata.ObjectName?.value || "",
              metadata.Artist?.value || "",
              ...(page.categories || [])
                .map(cat => cat.title || "")
            ].join(" ");


          const score =
            scoreResult(
              title,
              description,
              query
            );


          const id =
            String(page.pageid);


          const item = {

            id: `wiki-${id}`,

            title: title,

            artist:
              metadata.Artist?.value
                ?.replace(/<[^>]*>/g, "")
                ?.trim() ||
              "Wikimedia Commons",

            avatar:
              `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(
                title
              )}`,

            imageUrl: imageUrl,

            fullImageUrl:
              info.url || imageUrl,

            pageUrl:
              info.descriptionurl ||
              `https://commons.wikimedia.org/wiki/${encodeURIComponent(page.title)}`,

            source: "Wikimedia",

            likes: "",

            date:
              metadata.DateTimeOriginal?.value ||
              "",

            score: score

          };


          /*
           * The same image can appear in multiple
           * expanded searches. Keep only one copy.
           */

          const existing =
            results.get(id);


          if (
            !existing ||
            item.score > existing.score
          ) {

            results.set(
              id,
              item
            );

          }

        }

      }


      return [...results.values()]
        .sort(
          (a, b) =>
            b.score - a.score
        )
        .slice(0, 40);

    }


    /* =========================================================
       SEARCH
       ========================================================= */

    async function searchVault() {

      const query =
        document
          .getElementById("search-input")
          .value
          .trim();


      /*
       * Don't search until there is something useful.
       */

      if (query.length < 2) {

        document.getElementById(
          "search-status"
        ).textContent = "";

        document.getElementById(
          "section-title"
        ).textContent =
          "Featured Artworks";

        document.getElementById(
          "clear-search"
        ).classList.add("hidden");


        renderGrid(
          currentFilter === "all"
            ? vaultData
            : vaultData.filter(
                item =>
                  item.category === currentFilter
              )
        );

        return;

      }


      /*
       * Cancel an older request.
       */

      if (searchController) {

        searchController.abort();

      }


      searchController =
        new AbortController();


      const button =
        document.getElementById(
          "search-button"
        );


      const status =
        document.getElementById(
          "search-status"
        );


      const title =
        document.getElementById(
          "section-title"
        );


      const clear =
        document.getElementById(
          "clear-search"
        );


      button.disabled = true;


      button.innerHTML =
        `<span class="search-spinner"></span>`;


      status.textContent =
        "Searching real image sources...";


      title.textContent =
        `Searching for "${query}"`;


      clear.classList.remove(
        "hidden"
      );


      try {

        const results =
          await searchWikimedia(query);


        /*
         * If nothing was found, show a useful
         * message instead of leaving the page blank.
         */

        renderGrid(results);


        if (results.length) {

          status.textContent =
            `${results.length} image${results.length === 1 ? "" : "s"} found`;

        } else {

          status.textContent =
            "Nothing found. Try: furry Clyde, Clyde Discord, or Discord mascot";

        }

      }
      catch (error) {

        /*
         * Abort errors are normal when the user
         * searches again before the previous request
         * finishes.
         */

        if (error.name === "AbortError") {
          return;
        }


        console.error(
          "Clyde Vault search error:",
          error
        );


        renderGrid([]);


        status.textContent =
          "Search failed. Check your connection and try again.";

      }
      finally {

        button.disabled = false;

        button.textContent =
          "Search";

      }

    }


    /* =========================================================
       SEARCH SUBMIT
       ========================================================= */

    document
      .getElementById("search-form")
      .addEventListener(
        "submit",
        event => {

          event.preventDefault();

          searchVault();

        }
      );


    /* =========================================================
       CLEAR SEARCH
       ========================================================= */

    function clearSearch() {

      document
        .getElementById("search-input")
        .value = "";


      document
        .getElementById("search-status")
        .textContent = "";


      document
        .getElementById("clear-search")
        .classList.add("hidden");


      document
        .getElementById("section-title")
        .textContent =
          currentFilter === "all"
            ? "Featured Artworks"
            : currentFilter === "originals"
              ? "2021 Rebrand Vault"
              : currentFilter === "fanart"
                ? "Fan Art & Drawings"
                : "Memes & Edits";


      const results =
        currentFilter === "all"
          ? vaultData
          : vaultData.filter(
              item =>
                item.category === currentFilter
            );


      renderGrid(results);

    }


    /* =========================================================
       LIGHTBOX
       ========================================================= */

    function openLightbox(url) {

      if (!url)
        return;


      const lightbox =
        document.getElementById(
          "lightbox"
        );


      const image =
        document.getElementById(
          "lightbox-img"
        );


      image.src = url;

      lightbox.classList.add(
        "open"
      );

    }


    function closeLightbox(event) {

      if (
        event &&
        event.target !==
          document.getElementById("lightbox")
      ) {

        return;

      }


      document
        .getElementById("lightbox")
        .classList.remove("open");


      document
        .getElementById("lightbox-img")
        .src = "";

    }


    /* =========================================================
       ESCAPE KEY
       ========================================================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          document
            .getElementById("lightbox")
            .classList.remove("open");

        }

      }
    );


    /* =========================================================
       INITIALIZE
       ========================================================= */

    renderIcons();

    renderGrid(vaultData);

  </script>
