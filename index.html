<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Discover - Clyde Vault</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#313338;
  color:#fff;
}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#2b2d31}
::-webkit-scrollbar-thumb{
  background:#1a1b1e;
  border-radius:8px;
}

.hero{
  background:
    radial-gradient(circle at 15% 10%,rgba(255,255,255,.18),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(255,255,255,.1),transparent 28%),
    linear-gradient(135deg,#5865f2,#4752c4 55%,#2b2d31);
}

.card{
  background:#2b2d31;
  border:1px solid #1f2023;
  border-radius:12px;
  overflow:hidden;
  transition:.2s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#4e5058;
  box-shadow:0 12px 30px rgba(0,0,0,.3);
}

.image-box{
  height:210px;
  position:relative;
  background:#1e1f22;
  overflow:hidden;
}

.art-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.25s;
}

.card:hover .art-image{
  transform:scale(1.035);
}

.loader{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:#1e1f22;
  z-index:2;
}

.loader.hidden{display:none}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #4e5058;
  border-top-color:#5865f2;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.image-error{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#949ba4;
  background:#1e1f22;
  z-index:3;
}

.image-error.show{display:flex}

.badge{
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(0,0,0,.7);
  padding:5px 8px;
  border-radius:6px;
  font-size:10px;
  font-weight:bold;
}

.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lightbox.open{display:flex}

.lightbox img{
  max-width:95vw;
  max-height:88vh;
  object-fit:contain;
  border-radius:8px;
}

.close{
  position:absolute;
  top:18px;
  right:18px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  color:white;
  cursor:pointer;
  font-size:24px;
}

.close:hover{
  background:rgba(255,255,255,.22);
}
</style>
</head>

/* ============================================================

let currentCategory = "all";

/* ============================================================
   HTML ESCAPER
   ============================================================ */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   CARD CREATOR
   ============================================================ */

function createCard(item){

  const card = document.createElement("article");

  card.className = "card";


  const title =
    escapeHTML(item.title || "Untitled");

  const artist =
    escapeHTML(item.artist || "Unknown");

  const date =
    escapeHTML(item.date || "");

  const likes =
    escapeHTML(item.likes || "");

  const image =
    escapeHTML(item.imageUrl || "");

  const source =
    escapeHTML(item.source || "Vault");

  const page =
    escapeHTML(item.pageUrl || "");


  card.innerHTML = `

    <div class="image-box">

      <div class="loader">
        <div class="spinner"></div>
      </div>

      <img
        class="art-image"
        src="${image}"
        alt="${title}"
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
      >

      <div class="image-error">
        <div>
          <i data-lucide="image-off"
             class="w-8 h-8 mx-auto mb-2">
          </i>
          <div class="text-xs">

        </div>
      </div>

      <div class="badge">

        <div
          class="w-7 h-7 rounded-full bg-[#5865f2]
                 flex items-center justify-center

          ${escapeHTML((item.artist || "?")[0])}
        </div>

        <span class="text-xs font-bold truncate">
          ${artist}
        </span>

      </div>

      <h3 class="font-bold text-sm mb-1">
        ${title}
      </h3>

      ${
        page
        ? `
          <a
            href="${page}"
            target="_blank"
            rel="noopener noreferrer"
            onclick="event.stopPropagation()"
            class="text-[11px] text-[#b5bac1] hover:text-white"
          >
            Open source ↗
          </a>
        `
        : ""
      }

      <div
        class="mt-4 pt-3
               border-t border-[#35373c]
               flex justify-between
               text-[11px]
               text-[#949ba4]"
      >
        <span>${likes}</span>
        <span>${date}</span>
      </div>

    </div>

  `;


  const img =
    card.querySelector(".art-image");

  const loader =

  const error =
    card.querySelector(".image-error");


  img.addEventListener("load",()=>{

    loader.classList.add("hidden");

  });


  img.addEventListener("error",()=>{

    error.classList.add("show");

  });


  card.addEventListener("click",event=>{

    if(event.target.closest("a")){
      return;
    }

    openLightbox(item);

  });


  return card;

}


/* ============================================================
   RENDER
   ============================================================ */

function render(items){

  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";


  if(!items.length){

    grid.innerHTML = `

      <div
        class="col-span-full
               min-h-[250px]
               rounded-xl
               border border-[#3b3d44]
               bg-[#2b2d31]
               flex flex-col
               items-center
               justify-center
               text-center
               p-8"
      >

        <i data-lucide="search-x"
           class="w-10 h-10 mb-3 text-[#949ba4]">
        </i>

        <h3 class="font-bold mb-1">
          No images found
        </h3>

        <p class="text-sm text-[#949ba4]">
          Try another search.
        </p>

      </div>

    `;

    lucide.createIcons();

    return;

  }


  const fragment =
    document.createDocumentFragment();


  items.forEach(item=>{

    fragment.appendChild(
      createCard(item)
    );

  });


  grid.appendChild(fragment);

  lucide.createIcons();

}


/* ============================================================
   CATEGORY FILTER
   ============================================================ */

function filterCategory(category){

  currentCategory = category;

  document
    .querySelectorAll(".nav-btn")
    .forEach(button=>{

      button.classList.remove(
        "bg-[#35373c]",
        "text-white"
      );

      button.classList.add(
        "text-[#949ba4]"
      );

    });


  const active =
    document.getElementById(
      "nav-" + category
    );


  if(active){

    active.classList.add(
      "bg-[#35373c]",
      "text-white"
    );

    active.classList.remove(
      "text-[#949ba4]"
    );

  }


  const titles = {

    all:"Featured Artworks",

    originals:"2021 REBRAND VAULT",

    fanart:"FAN ART & DRAWINGS",

    memes:"MEMES & EDITS"

  };


  document.getElementById(
    "sectionTitle"
  ).textContent =
    titles[category] || "Featured Artworks";


  document.getElementById(
    "clearButton"
  ).classList.add("hidden");


  document.getElementById(
    "searchInput"
  ).value = "";


  document.getElementById(
    "status"
  ).textContent = "";


  const results =
    category === "all"
      ? vaultData
      : vaultData.filter(
          item =>
            item.category === category
        );


  render(results);

}


/* ============================================================
   CLYDE QUERY ENGINE
   ============================================================ */

function buildSearchQueries(query){

  const q =
    query
      .trim()
      .replace(/\s+/g," ");


  const lower =
    q.toLowerCase();


  const signals = [

    "clyde",
    "discord",
    "mascot",
    "furry",
    "anthro",
    "anthropomorphic",
    "fanart",
    "fan art"

  ];


  const isClydeSearch =
    signals.some(
      signal =>
        lower.includes(signal)
    );


  /*
   * Normal search:
   *
   * "cat"
   *
   * stays "cat".
   */

  if(!isClydeSearch){

    return [q];

  }


  const queries =
    new Set();


  queries.add(q);


  /*
   * Automatically add Clyde if
   * the query talks about Discord
   * without mentioning Clyde.
   */

  if(!lower.includes("clyde")){

    queries.add(
      `${q} Clyde`
    );

  }


  /*
   * Furry/anthro Clyde.
   */

  if(
    lower.includes("furry") ||
    lower.includes("anthro") ||
    lower.includes("anthropomorphic")
  ){

    queries.add(
      "Clyde Discord furry"
    );

    queries.add(
      "Clyde Discord anthro"
    );

    queries.add(
      "Discord mascot furry"
    );

    queries.add(
      "Discord Clyde character art"
    );

  }


  /*
   * Fan art.
   */

  if(
    lower.includes("fanart") ||
    lower.includes("fan art")
  ){

    queries.add(
      "Clyde Discord fan art"
    );

    queries.add(
      "Clyde Discord fanart"
    );

  }


  /*
   * Mascot.
   */

  if(
    lower.includes("mascot")
  ){

    queries.add(
      "Clyde Discord mascot"
    );

    queries.add(
      "Clyde mascot character"
    );

  }


  /*
   * Generic Discord query.
   */

  if(
    lower.includes("discord") &&
    !lower.includes("furry") &&
    !lower.includes("anthro") &&
    !lower.includes("mascot") &&
    !lower.includes("fanart") &&
    !lower.includes("fan art")
  ){

    queries.add(
      "Clyde Discord"
    );

    queries.add(
      "Discord Clyde artwork"
    );

  }


  return [...queries];

}


/* ============================================================
   WIKIMEDIA SEARCH
   ============================================================ */

async function searchWikimedia(query){

  const queries =
    buildSearchQueries(query);


  const requests =
    queries.map(async term=>{

      const params =
        new URLSearchParams({

          action:"query",

          generator:"search",

          gsrsearch:term,

          gsrnamespace:"6",

          gsrlimit:"20",

          prop:"imageinfo|categories",

          cllimit:"20",

          iiprop:
            "url|size|mime|extmetadata",

          iiurlwidth:"900",

          format:"json",

          formatversion:"2",

          origin:"*"

        });


      const response =
        await fetch(
          "https://commons.wikimedia.org/w/api.php?" +
          params.toString(),
          {
            cache:"no-store",
            signal:
              currentController?.signal
          }
        );


      if(!response.ok){

        throw new Error(
          "Wikimedia API error: " +
          response.status
        );

      }


      return response.json();

    });


  const data =
    await Promise.all(requests);


  const results =
    new Map();


  for(const response of data){

    const pages =
      response?.query?.pages || [];


    for(const page of pages){

      const info =
        page.imageinfo?.[0];


      /*
       * THIS IS THE FIXED SYNTAX.
       *
       * No "?. [0]" bullshit.
       */

      if(
        !info ||
        (!info.thumburl && !info.url)
      ){

        continue;

      }


      const title =
        String(
          page.title || "Untitled"
        ).replace(
          /^File:/i,
          ""
        );


      const metadata =
        info.extmetadata || {};


      const description =
        [
          metadata
            .ImageDescription
            ?.value || "",

          metadata
            .ObjectName
            ?.value || "",

          ...(page.categories || [])
            .map(
              category =>
                category.title || ""
            )

        ].join(" ");


      const text =
        `${title} ${description}`
          .toLowerCase();


      const lowerQuery =
        query.toLowerCase();


      let score = 0;


      /*
       * Clyde gets a HUGE relevance boost.
       */

      if(text.includes("clyde"))
        score += 100;


      /*
       * Discord is also important.
       */

      if(text.includes("discord"))
        score += 60;


      if(text.includes("mascot"))
        score += 30;


      if(
        /\bfurry\b|\banthro\b|\banthropomorphic\b/
          .test(te
