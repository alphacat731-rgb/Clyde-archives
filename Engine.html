<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clyde Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #2b2d31; }
    ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#313338] text-[#f2f3f5] font-sans antialiased h-screen overflow-hidden flex select-none">

  <!-- 1. SERVER BAR -->
  <div class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 gap-2 flex-shrink-0">
    <div class="w-12 h-12 bg-[#5865f2] rounded-[16px] flex items-center justify-center cursor-pointer">
      <i data-lucide="bot" class="w-7 h-7 text-white"></i>
    </div>
  </div>

  <!-- 2. CHANNEL BAR -->
  <div class="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0">
    <div class="h-12 border-b border-[#1f2023] px-4 flex items-center justify-between font-bold text-white shadow-sm">
      <span>Clyde Vault</span>
    </div>
    <div class="p-2 space-y-1">
      <div class="px-2 py-1 text-xs font-bold text-[#949ba4] uppercase">Channels</div>
      <div class="flex items-center gap-1.5 px-2 py-1.5 rounded bg-[#35373c] text-white cursor-pointer">
        <i data-lucide="hash" class="w-5 h-5 text-[#80848e]"></i>
        <span class="font-medium text-sm">furry-clyde-gallery</span>
      </div>
    </div>
  </div>

  <!-- 3. MAIN CHAT & GALLERY AREA -->
  <div class="flex-1 flex flex-col bg-[#313338] h-full overflow-hidden">
    <!-- Top Header -->
    <div class="h-12 border-b border-[#232428] px-4 flex items-center gap-2 shadow-sm flex-shrink-0">
      <i data-lucide="hash" class="w-6 h-6 text-[#80848e]"></i>
      <span class="font-bold text-white">furry-clyde-gallery</span>
    </div>

    <!-- Chat Messages Container -->
    <div id="chat-feed" class="flex-1 overflow-y-auto p-4 space-y-6">
      <!-- Dynamic Messages with Direct Images Render Here -->
    </div>

    <!-- 4. PAGINATION FOOTER -->
    <div class="h-14 bg-[#2b2d31] border-t border-[#232428] px-6 flex items-center justify-between flex-shrink-0">
      <button id="prev-btn" onclick="changePage(-1)" class="px-3 py-1.5 bg-[#35373c] hover:bg-[#404249] text-white text-sm font-medium rounded transition disabled:opacity-40 disabled:cursor-not-allowed">
        ← Previous Page
      </button>

      <span id="page-indicator" class="text-xs text-[#949ba4] font-medium">Page 1 of 1</span>

      <button id="next-btn" onclick="changePage(1)" class="px-3 py-1.5 bg-[#5865f2] hover:bg-[#4752c4] text-white text-sm font-medium rounded transition disabled:opacity-40 disabled:cursor-not-allowed">
        Next Page →
      </button>
    </div>
  </div>

  <!-- FULLSCREEN LIGHTBOX -->
  <div id="image-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 cursor-pointer" onclick="closeModal()">
    <img id="modal-img" src="" class="max-w-full max-h-full rounded shadow-2xl object-contain">
  </div>

  <script>
    lucide.createIcons();

    // ARRAY OF IMAGES (Add as many items as you want here)
    const galleryItems = [
      {
        id: 1,
        botName: "ClydeBot",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Clyde1",
        timestamp: "05/14/2021 1:56 AM",
        artist: "Neku_ZX",
        imageUrl: "https://art.ngfiles.com/images/1838000/1838634_nekuzx_discord.png"
      },
      {
        id: 2,
        botName: "ClydeBot",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Clyde1",
        timestamp: "05/15/2021 4:20 PM",
        artist: "Community Archive",
        imageUrl: "https://i.kym-cdn.com/entries/icons/original/000/037/242/cover2.jpg"
      },
      {
        id: 3,
        botName: "ClydeBot",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Clyde1",
        timestamp: "05/16/2021 10:11 AM",
        artist: "Reddit Fanart",
        imageUrl: "https://preview.redd.it/blursed-logo-v0-ndtr6n.jpg?auto=webp&s=3f7b8a826490e9e2bf4ba2e118c7e09968b69324"
      }
    ];

    // PAGINATION SETTINGS
    let currentPage = 1;
    const itemsPerPage = 2; // Adjust how many images appear on each page

    function renderPage() {
      const feed = document.getElementById("chat-feed");
      feed.innerHTML = "";

      const totalPages = Math.ceil(galleryItems.length / itemsPerPage) || 1;
      const startIndex = (currentPage - 1) * itemsPerPage;
      const pageItems = galleryItems.slice(startIndex, startIndex + itemsPerPage);

      pageItems.forEach(item => {
        const msg = document.createElement("div");
        msg.className = "flex gap-4 group hover:bg-[#2e3035] -mx-4 px-4 py-2 rounded transition-colors";
        msg.innerHTML = `
          <img src="${item.avatar}" class="w-10 h-10 rounded-full bg-[#1e1f22] flex-shrink-0">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-white">${item.botName}</span>
              <span class="bg-[#5865f2] text-[10px] font-bold text-white px-1 rounded uppercase">BOT</span>
              <span class="text-xs text-[#949ba4]">${item.timestamp}</span>
            </div>
            <p class="text-[#dbdee1] text-xs mt-0.5">Artist: <span class="text-[#00a8fc]">${item.artist}</span></p>

            <!-- DIRECT INLINE IMAGE ATTACHMENT -->
            <div class="mt-2 bg-[#2b2d31] p-2 rounded-lg border border-[#232428] inline-block max-w-lg">
              <img src="${item.imageUrl}" 
                   onclick="openModal('${item.imageUrl}')" 
                   class="w-full max-h-[400px] object-cover rounded cursor-pointer hover:opacity-95 transition-opacity">
            </div>
          </div>
        `;
        feed.appendChild(msg);
      });

      // Update Pagination Controls
      document.getElementById("page-indicator").innerText = `Page ${currentPage} of ${totalPages}`;
      document.getElementById("prev-btn").disabled = currentPage === 1;
      document.getElementById("next-btn").disabled = currentPage === totalPages;
      
      feed.scrollTop = 0; // Scroll back to top on page change
    }

    function changePage(direction) {
      currentPage += direction;
      renderPage();
    }

    function openModal(url) {
      document.getElementById("modal-img").src = url;
      document.getElementById("image-modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("image-modal").classList.add("hidden");
    }

    renderPage();
  </script>
</body>
</html>
