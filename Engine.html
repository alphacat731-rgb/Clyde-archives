<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clyde Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom Scrollbar to match Discord */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #2b2d31; }
    ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#313338] text-[#f2f3f5] font-sans antialiased h-screen overflow-hidden flex select-none">

  <div class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 gap-2 flex-shrink-0">
    <div class="w-12 h-12 bg-[#5865f2] rounded-[16px] flex items-center justify-center cursor-pointer hover:rounded-[12px] transition-all">
      <i data-lucide="bot" class="w-7 h-7 text-white"></i>
    </div>
    <div class="w-8 h-[2px] bg-[#35363c] rounded my-1"></div>
    <div class="w-12 h-12 bg-[#313338] hover:bg-[#5865f2] rounded-[24px] hover:rounded-[16px] flex items-center justify-center cursor-pointer transition-all group">
      <i data-lucide="archive" class="w-6 h-6 text-[#dbdee1] group-hover:text-white"></i>
    </div>
  </div>

  <div class="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0">
    <div class="h-12 border-b border-[#1f2023] px-4 flex items-center justify-between font-bold text-white shadow-sm">
      <span>Clyde Vault</span>
      <i data-lucide="chevron-down" class="w-5 h-5 text-[#949ba4]"></i>
    </div>

    <div class="p-2 space-y-1 overflow-y-auto flex-1">
      <div class="px-2 py-1 text-xs font-bold text-[#949ba4] uppercase tracking-wider">Categories</div>
      
      <button onclick="filterCategory('all')" id="btn-all" class="channel-btn w-full flex items-center gap-1.5 px-2 py-1.5 rounded text-[#949ba4] hover:bg-[#35373c] hover:text-[#dbdee1]">
        <i data-lucide="hash" class="w-5 h-5 text-[#80848e]"></i>
        <span class="font-medium text-sm">all-images</span>
      </button>

      <button onclick="filterCategory('classic')" id="btn-classic" class="channel-btn w-full flex items-center gap-1.5 px-2 py-1.5 rounded text-[#949ba4] hover:bg-[#35373c] hover:text-[#dbdee1]">
        <i data-lucide="hash" class="w-5 h-5 text-[#80848e]"></i>
        <span class="font-medium text-sm">2021-originals</span>
      </button>

      <button onclick="filterCategory('fanart')" id="btn-fanart" class="channel-btn w-full flex items-center gap-1.5 px-2 py-1.5 rounded text-[#949ba4] hover:bg-[#35373c] hover:text-[#dbdee1]">
        <i data-lucide="hash" class="w-5 h-5 text-[#80848e]"></i>
        <span class="font-medium text-sm">fan-art</span>
      </button>
    </div>
  </div>

  <div class="flex-1 flex flex-col bg-[#313338] h-full overflow-hidden">
    <div class="h-12 border-b border-[#232428] px-4 flex items-center gap-2 shadow-sm flex-shrink-0">
      <i data-lucide="hash" class="w-6 h-6 text-[#80848e]"></i>
      <span class="font-bold text-white" id="current-channel">all-images</span>
      <span class="text-xs text-[#949ba4] border-l border-[#3f4147] pl-3 ml-2">Archiving every Clyde incarnation</span>
    </div>

    <div id="chat-feed" class="flex-1 overflow-y-auto p-4 space-y-6">
      </div>
  </div>

  <div id="image-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 cursor-pointer" onclick="closeModal()">
    <img id="modal-img" src="" class="max-w-full max-h-full rounded shadow-2xl object-contain">
  </div>

  <script>
    // Initialize Icons
    lucide.createIcons();

    // GALLERY DATA (Add your image URLs and metadata here)
    const galleryData = [
      {
        id: 1,
        artist: "Neku_ZX",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Neku",
        timestamp: "05/14/2021 1:56 AM",
        caption: "furry discord",
        imageUrl: "https://art.ngfiles.com/images/1838000/1838634_nekuzx_discord.png",
        category: "classic",
        sourceUrl: "https://www.newgrounds.com/art/view/nekuzx/discord"
      }
    ];

    function renderFeed(data) {
      const feed = document.getElementById("chat-feed");
      feed.innerHTML = "";

      data.forEach(item => {
        const msg = document.createElement("div");
        msg.className = "flex gap-4 group hover:bg-[#2e3035] -mx-4 px-4 py-1 rounded transition-colors";
        msg.innerHTML = `
          <img src="${item.avatar}" class="w-10 h-10 rounded-full bg-[#1e1f22] flex-shrink-0">
          <div class="flex-1 min-w-0">
            <div class="flex items-baseline gap-2">
              <span class="font-semibold text-white hover:underline cursor-pointer">${item.artist}</span>
              <span class="text-xs text-[#949ba4]">${item.timestamp}</span>
            </div>
            <p class="text-[#dbdee1] text-sm mt-0.5">${item.caption}</p>
            <div class="mt-2 relative inline-block">
              <img src="${item.imageUrl}" 
                   onclick="openModal('${item.imageUrl}')" 
                   class="max-w-xs md:max-w-md max-h-96 rounded-lg cursor-pointer hover:opacity-95 transition-opacity border border-[#232428]">
            </div>
            ${item.sourceUrl ? `
              <div class="mt-1">
                <a href="${item.sourceUrl}" target="_blank" class="text-xs text-[#00a8fc] hover:underline flex items-center gap-1">
                  Original Source <i data-lucide="external-link" class="w-3 h-3"></i>
                </a>
              </div>
            ` : ''}
          </div>
        `;
        feed.appendChild(msg);
      });
      lucide.createIcons();
    }

    function filterCategory(category) {
      document.getElementById("current-channel").innerText = category === 'all' ? 'all-images' : `${category}-images`;
      
      if (category === 'all') {
        renderFeed(galleryData);
      } else {
        const filtered = galleryData.filter(item => item.category === category);
        renderFeed(filtered);
      }
    }

    function openModal(url) {
      document.getElementById("modal-img").src = url;
      document.getElementById("image-modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("image-modal").classList.add("hidden");
    }

    // Initial Load
    renderFeed(galleryData);
  </script>
</body>
</html>
