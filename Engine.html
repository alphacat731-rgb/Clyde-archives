<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clyde Archive Client</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen overflow-hidden flex select-none">

  <!-- 1. LEFTMOST SERVER BAR (Screenshot 1 & 3) -->
  <aside class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 gap-2 flex-shrink-0">
    <button onclick="switchView('chat')" class="relative group">
      <div class="w-12 h-12 bg-[#5865f2] rounded-[16px] flex items-center justify-center transition-all">
        <i data-lucide="bot" class="w-7 h-7 text-white"></i>
      </div>
    </button>
    <div class="w-8 h-[2px] bg-[#35363c] rounded my-1"></div>
    <button onclick="switchView('discover')" class="w-12 h-12 bg-[#313338] hover:bg-[#23a55a] rounded-[24px] hover:rounded-[16px] flex items-center justify-center transition-all group">
      <i data-lucide="compass" class="w-6 h-6 text-[#dbdee1] group-hover:text-white"></i>
    </button>
  </aside>

  <!-- 2. CHANNEL / DIRECT MESSAGES SIDEBAR -->
  <aside class="w-60 bg-[#2b2d31] flex flex-col flex-shrink-0">
    <div class="h-12 border-b border-[#1f2023] px-4 flex items-center justify-between font-bold text-white shadow-sm">
      <span>Furry Clyde Vault</span>
      <i data-lucide="chevron-down" class="w-5 h-5 text-[#949ba4]"></i>
    </div>

    <!-- Channels List -->
    <div class="p-2 space-y-1 overflow-y-auto flex-1">
      <div class="px-2 py-1 text-[12px] font-bold text-[#949ba4] uppercase tracking-wider">Gallery Channels</div>
      
      <button onclick="filterChannel('all')" class="w-full flex items-center gap-1.5 px-2 py-1.5 rounded text-[#949ba4] hover:bg-[#35373c] hover:text-[#dbdee1]">
        <i data-lucide="hash" class="w-5 h-5 text-[#80848e]"></i>
        <span class="font-medium text-sm">all-artworks</span>
      </button>

      <button onclick="filterChannel('2021-originals')" class="w-full flex items-center gap-1.5 px-2 py-1.5 rounded text-[#949ba4] hover:bg-[#35373c] hover:text-[#dbdee1]">
        <i data-lucide="hash" class="w-5 h-5 text-[#80848e]"></i>
        <span class="font-medium text-sm">2021-originals</span>
      </button>

      <button onclick="filterChannel('fan-art')" class="w-full flex items-center gap-1.5 px-2 py-1.5 rounded text-[#949ba4] hover:bg-[#35373c] hover:text-[#dbdee1]">
        <i data-lucide="hash" class="w-5 h-5 text-[#80848e]"></i>
        <span class="font-medium text-sm">fan-art</span>
      </button>
    </div>

    <!-- User Profile Bar at Bottom Left (Screenshot 1) -->
    <div class="h-14 bg-[#232428] px-2 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2 px-1 py-1 rounded hover:bg-[#35373c] cursor-pointer flex-1 min-w-0">
        <div class="relative">
          <div class="w-8 h-8 rounded-full bg-[#5865f2] flex items-center justify-center font-bold text-white text-xs">Mg</div>
          <div class="w-3 h-3 bg-[#23a55a] rounded-full absolute -bottom-0.5 -right-0.5 border-2 border-[#232428]"></div>
        </div>
        <div class="flex flex-col min-w-0">
          <span class="text-xs font-bold text-white truncate">Mg</span>
          <span class="text-[10px] text-[#949ba4]">#9282</span>
        </div>
      </div>
      <div class="flex items-center text-[#b5bac1]">
        <button class="p-1.5 hover:bg-[#35373c] hover:text-white rounded"><i data-lucide="mic" class="w-4 h-4"></i></button>
        <button class="p-1.5 hover:bg-[#35373c] hover:text-white rounded"><i data-lucide="headphones" class="w-4 h-4"></i></button>
        <button class="p-1.5 hover:bg-[#35373c] hover:text-white rounded"><i data-lucide="settings" class="w-4 h-4"></i></button>
      </div>
    </div>
  </aside>

  <!-- 3. MAIN WORKSPACE VIEW -->
  <main class="flex-1 flex flex-col bg-[#313338] h-full overflow-hidden">
    <!-- Top Bar -->
    <header class="h-12 border-b border-[#232428] px-4 flex items-center justify-between shadow-sm flex-shrink-0">
      <div class="flex items-center gap-2">
        <i data-lucide="hash" class="w-6 h-6 text-[#80848e]"></i>
        <span class="font-bold text-white" id="header-title">all-artworks</span>
      </div>
      <div class="flex items-center gap-4 text-[#b5bac1]">
        <button onclick="switchView('discover')" class="text-xs font-medium bg-[#35373c] hover:bg-[#404249] text-white px-2.5 py-1 rounded">Explore Cards</button>
      </div>
    </header>

    <!-- Main Content Container -->
    <div class="flex-1 flex overflow-hidden">
      <!-- Chat / Gallery Feed -->
      <section id="main-feed" class="flex-1 overflow-y-auto p-4 space-y-6">
        <!-- Javascript renders feed content here -->
      </section>

      <!-- Right Member Sidebar (Screenshot 3) -->
      <aside id="member-sidebar" class="w-60 bg-[#2b2d31] p-3 flex flex-col space-y-4 overflow-y-auto flex-shrink-0 hidden md:flex">
        <!-- Javascript renders member list here -->
      </aside>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
